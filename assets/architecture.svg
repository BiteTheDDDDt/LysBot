<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730" role="img" aria-labelledby="title desc">
  <title id="title">LysBot 消息处理与记忆架构</title>
  <desc id="desc">QQ 经 NapCat 接入，进行参与规划、工具执行、聊天成文、发送回执。SQLite 保存历史与记忆，FTS5 和本地 BGE 提供检索，可选模型和插件提供工具。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52877d"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#24473f;text-anchor:middle;font-size:19px}
      .sub{font-size:15px;fill:#527168}.box{fill:#fff;stroke:#acd1c6;stroke-width:1.5}.main{fill:#def2e9;stroke:#7eb9a6;stroke-width:1.5}
      .line{fill:none;stroke:#52877d;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}
    </style>
  </defs>
  <rect width="1080" height="730" rx="20" fill="#f5faf7"/>
  <text x="540" y="41" style="font-size:23px;font-weight:600">LysBot · 从群聊到回复</text>
  <rect class="main" x="390" y="65" width="300" height="48" rx="12"/><text x="540" y="96">QQ</text>
  <path class="line both" d="M540 120V142"/>
  <rect class="main" x="390" y="150" width="300" height="60" rx="12"/><text x="540" y="177">NapCat</text><text class="sub" x="540" y="198">OneBot v11 · 消息与事件</text>
  <path class="line" d="M540 210V240"/>
  <rect class="main" x="390" y="240" width="300" height="60" rx="12"/><text x="540" y="276">消息接入与聚合</text>
  <path class="line" d="M540 300V330"/>
  <rect class="main" x="390" y="330" width="300" height="60" rx="12"/><text x="540" y="357">参与规划</text><text class="sub" x="540" y="378">是否接话、回应谁、是否等待</text>
  <path class="line" d="M540 390V420"/>
  <rect class="main" x="390" y="420" width="300" height="60" rx="12"/><text x="540" y="447">执行规划与工具调用</text><text class="sub" x="540" y="468">检索、核验来源、按需调用工具</text>
  <path class="line" d="M540 480V510"/>
  <rect class="main" x="390" y="510" width="300" height="60" rx="12"/><text x="540" y="546">聊天成文</text>
  <path class="line" d="M540 570V600"/>
  <rect class="main" x="390" y="600" width="300" height="60" rx="12"/><text x="540" y="627">发送与回执</text><text class="sub" x="540" y="648">权限、隔离、超时、并发、防重</text>
  <path class="line" d="M690 630H1040V180H690"/>
  <text class="sub" x="1018" y="396" transform="rotate(-90 1018 396)">返回 QQ · 以真实发送结果为准</text>
  <rect class="box" x="35" y="335" width="280" height="70" rx="12"/><text x="175" y="364">SQLite 历史与记忆</text><text class="sub" x="175" y="389">原文、摘要、来源、记忆纠错</text>
  <path class="line" d="M390 270H175V335"/>
  <path class="line both" d="M315 370H350V450H390"/>
  <path class="line both" d="M175 412V442"/>
  <rect class="box" x="35" y="450" width="280" height="80" rx="12"/><text x="175" y="480">FTS5 + 本地 BGE</text><text class="sub" x="175" y="506">sqlite-vec · 关键词 / 语义检索</text>
  <rect class="box" x="740" y="410" width="250" height="80" rx="12"/><text x="865" y="440">可选模型与插件</text><text class="sub" x="865" y="467">搜索 · 识图 · 语音 · 生图</text>
  <path class="line both" d="M697 450H733"/>
  <text class="sub" x="540" y="704">MODEL_GENERAL 支撑基础文本任务 · 专用能力按配置启用 · 人设独立配置</text>
</svg>
