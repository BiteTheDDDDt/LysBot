[project]
name = "LysBot"
version = "0.1.0"
description = "LysBot — 磷叶石 QQ 群聊机器人"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "nonebot2[fastapi]>=2.2.0",
    "nonebot-adapter-onebot>=2.4.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "nonebot-plugin-apscheduler>=0.3.0",
    "Pillow>=10.0.0",
    "qrcode[pil]>=8.0",
    "jieba==0.42.1",
    "sqlite-vec==0.1.6",
    "onnxruntime==1.30.0",
    "tokenizers==0.22.2",
]

[project.optional-dependencies]
dev = [
    "nonebot2[fastapi]",
    "ruff>=0.1.0",
    "websockets>=15",
]
# Optional fallback when the MODEL_SEARCH route is unavailable; the import is
# guarded at runtime, so installing this extra only enables the DDG path.
search = [
    "duckduckgo-search>=6",
]

[project.urls]
Repository = "https://github.com/BiteTheDDDDt/LysBot"
Issues = "https://github.com/BiteTheDDDDt/LysBot/issues"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugin_dirs = ["src/plugins"]

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "lysbot"]

[tool.hatch.build.targets.wheel.force-include]
"personas" = "personas"
