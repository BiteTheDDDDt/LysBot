name: lysbot

services:
  bot:
    build: .
    image: lysbot:local
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TZ: Asia/Shanghai
      LLM_CHAT_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./personas:/app/personas:ro
      - ./knowledge:/app/knowledge:ro
      - ./extensions:/app/extensions:ro
    healthcheck:
      test: [CMD, python, scripts/healthcheck.py]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - 127.0.0.1:16099:6099
    volumes:
      - ./data/napcat/qq:/app/.config/QQ
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/plugins:/app/napcat/plugins
    depends_on:
      bot:
        condition: service_started

  setup:
    profiles: [setup]
    build: .
    image: lysbot:local
    command: [python, scripts/prepare_local_embedding.py]
    volumes:
      - ./data:/app/data
